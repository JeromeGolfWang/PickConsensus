<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Losers Pick'em - 2025 Season</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="nfl-confidence.css">
</head>
<body>
    <header class="p-3 bg-dark text-white">
        NFL Losers Pick'em - 2025 Season
    </header>
    <div class="container mt-3">
        <div class="row">
            <div class="col-md-6">
                <label>Select Week</label>
                <select id="weekSelector" class="form-select">
                    <option>-- Select Week --</option>
                </select>
            </div>
            <div class="col-md-6">
                <label>Select Player</label>
                <select id="playerSelector" class="form-select">
                    <option>-- Select Player --</option>
                    <option>Dan</option>
                    <option>Tim</option>
                    <option>Patrick</option>
                    <option>Jay</option>
                </select>
            </div>
        </div>
        <div id="gamesContainer" class="mt-3"></div>
        <button id="saveButton" class="btn btn-primary mt-3">Save Picks</button>
    </div>
    <div class="container mt-5">
        <h2>Consensus Scoreboard</h2>
        <div id="consensusButtons"></div>
        <div id="consensusDisplay"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="nfl-confidence-picks.js"></script>
</body>
</html>
